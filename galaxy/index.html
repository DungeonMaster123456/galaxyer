<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy — build your business</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --bg: #0b0e1a;
  --bg-raised: #11162a;
  --bg-panel: #161c35;
  --bg-panel-hi: #1c2340;
  --line: #2a3358;
  --line-soft: #1c2340;
  --text: #eef1fb;
  --text-dim: #9aa3c7;
  --text-faint: #626b93;
  --purple: #8b5cf6;
  --purple-dim: #3d2d6b;
  --cyan: #22d3ee;
  --cyan-dim: #164450;
  --amber: #fbbf24;
  --amber-dim: #4d3a12;
  --green: #34d399;
  --green-dim: #164a37;
  --red: #fb7185;
  --grad-1: linear-gradient(135deg, #8b5cf6, #22d3ee);
  --grad-2: linear-gradient(135deg, #fbbf24, #fb923c);
  --disp: 'Space Grotesk', sans-serif;
  --sans: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(139,92,246,0.18), transparent 60%),
    radial-gradient(ellipse 700px 500px at 90% 0%, rgba(34,211,238,0.12), transparent 55%);
  background-attachment:fixed;
}
::selection{ background:var(--purple-dim); color:#fff; }
a{ color:inherit; }
button{ font-family:inherit; cursor:pointer; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

@keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
@keyframes popIn{ from{opacity:0; transform:scale(.96);} to{opacity:1; transform:scale(1);} }
@keyframes glowPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(139,92,246,0.35);} 50%{ box-shadow:0 0 0 6px rgba(139,92,246,0);} }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

/* ---------- Top bar ---------- */
.topbar{
  display:flex; align-items:center; gap:14px;
  padding:14px 24px;
  border-bottom:1px solid var(--line);
  background:rgba(17,22,42,0.85);
  backdrop-filter: blur(10px);
  position:sticky; top:0; z-index:50;
}
.brand{
  display:flex; align-items:center; gap:10px;
  font-family:var(--disp); font-weight:700; font-size:18px;
  letter-spacing:-0.01em; cursor:pointer; user-select:none;
}
.brand .mark{
  width:30px; height:30px; border-radius:9px;
  background:var(--grad-1);
  display:flex; align-items:center; justify-content:center;
  color:#0b0e1a; font-weight:800; font-size:15px;
  font-family:var(--disp);
  box-shadow:0 0 18px rgba(139,92,246,0.45);
}
.brand .dim{ color:var(--text-faint); font-weight:400; font-family:var(--sans); font-size:13px; margin-left:2px; }
.topbar-spacer{flex:1;}
.search-box{
  display:flex; align-items:center; gap:8px;
  background:var(--bg-panel); border:1px solid var(--line);
  border-radius:9px; padding:8px 13px; width:280px;
  color:var(--text-faint); font-size:13px;
  transition:.15s;
}
.search-box:focus-within{ border-color:var(--purple); box-shadow:0 0 0 3px rgba(139,92,246,0.15); }
.search-box input{
  background:none; border:none; outline:none; color:var(--text);
  font-family:var(--sans); font-size:13.5px; width:100%;
}
.search-box input::placeholder{ color:var(--text-faint); }
.btn{
  padding:8px 16px; border-radius:9px; font-size:13.5px; font-weight:600;
  cursor:pointer; transition:.15s; border:1px solid var(--line);
  background:var(--bg-panel); color:var(--text-dim);
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.btn:hover{ border-color:var(--text-faint); color:var(--text); background:var(--bg-panel-hi); }
.btn.primary{
  background:var(--grad-1); color:#0b0e1a; border-color:transparent; font-weight:700;
  box-shadow:0 2px 14px rgba(139,92,246,0.3);
}
.btn.primary:hover{ filter:brightness(1.08); transform:translateY(-1px); box-shadow:0 4px 18px rgba(139,92,246,0.42); }
.btn.danger{ color:var(--red); }
.btn.danger:hover{ border-color:var(--red); background:rgba(251,113,133,0.08); }
.btn:active{ transform:scale(.97); }

.avatar-btn{
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--disp); font-weight:700; font-size:14px;
  cursor:pointer; border:2px solid var(--line); color:#0b0e1a;
  flex-shrink:0; transition:.15s;
}
.avatar-btn:hover{ border-color:var(--cyan); transform:scale(1.05); }

/* ---------- Layout ---------- */
.layout{
  display:grid;
  grid-template-columns:264px 1fr;
  min-height:calc(100vh - 61px);
}
@media (max-width: 860px){
  .layout{ grid-template-columns:1fr; }
  .sidebar{ display:none; }
  .sidebar.open{ display:block; }
}

.sidebar{
  border-right:1px solid var(--line);
  background:rgba(17,22,42,0.5);
  padding:20px 14px;
  position:sticky; top:61px; height:calc(100vh - 61px);
  overflow-y:auto;
}
.side-label{
  font-size:11px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--text-faint); font-weight:700; margin:20px 10px 9px;
  font-family:var(--disp);
}
.side-label:first-child{ margin-top:2px; }
.side-nav-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 11px; border-radius:9px; cursor:pointer;
  font-size:14px; color:var(--text-dim); margin-bottom:3px;
  transition:.13s; border:1px solid transparent; font-weight:500;
}
.side-nav-item:hover{ background:var(--bg-panel); color:var(--text); }
.side-nav-item.active{ background:var(--bg-panel-hi); color:var(--text); border-color:var(--line); }

.repo-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 11px; border-radius:9px; cursor:pointer;
  font-size:13.5px; color:var(--text-dim); margin-bottom:3px;
  transition:.13s; border:1px solid transparent;
}
.repo-item:hover{ background:var(--bg-panel); color:var(--text); }
.repo-item.active{
  background:var(--bg-panel-hi); color:var(--text);
  border-color:var(--line);
}
.repo-item .dot{
  width:9px; height:9px; border-radius:50%; flex-shrink:0;
  box-shadow:0 0 8px currentColor;
}
.repo-item .count{
  margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--text-faint);
  background:var(--bg); padding:1px 7px; border-radius:20px;
}
.new-repo-btn{
  width:100%; margin-top:12px;
  display:flex; align-items:center; justify-content:center; gap:6px;
  background:none; border:1.5px dashed var(--line); color:var(--text-faint);
  padding:10px; border-radius:9px; font-size:13px; font-weight:600;
  cursor:pointer; transition:.15s;
}
.new-repo-btn:hover{ border-color:var(--purple); color:var(--purple); background:rgba(139,92,246,0.06); }

/* ---------- Main ---------- */
.main{ padding:32px 36px 70px; max-width:1080px; animation:fadeUp .35s ease; }

.repo-header{
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:20px; margin-bottom:8px; flex-wrap:wrap;
}
.repo-title{
  font-family:var(--disp); font-size:26px; font-weight:700;
  display:flex; align-items:center; gap:11px; letter-spacing:-0.01em;
}
.repo-title .badge{
  font-family:var(--sans); font-size:11px; font-weight:700;
  border:1px solid var(--line); color:var(--text-faint);
  padding:3px 10px; border-radius:20px; background:var(--bg-panel);
}
.repo-desc{ color:var(--text-dim); font-size:14.5px; margin:8px 0 20px; max-width:640px; line-height:1.5; }
.repo-desc[contenteditable]:focus{ outline:1.5px dashed var(--purple); border-radius:6px; padding:2px 4px; margin-left:-4px; }

.repo-actions{ display:flex; gap:10px; flex-wrap:wrap; }

.stat-row{
  display:flex; gap:24px; margin-bottom:26px; flex-wrap:wrap;
}
.stat{
  font-size:12.5px; color:var(--text-faint); display:flex; align-items:center; gap:6px;
}
.stat b{ color:var(--text); font-weight:700; font-family:var(--mono); }

.toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
.toolbar-spacer{flex:1;}

.file-drop{
  border:1.5px dashed var(--line);
  border-radius:12px;
  padding:22px;
  text-align:center;
  color:var(--text-faint);
  font-size:13.5px;
  margin-bottom:18px;
  transition:.15s;
  cursor:pointer;
  background:rgba(139,92,246,0.02);
}
.file-drop:hover{ border-color:var(--text-faint); }
.file-drop.dragover{
  border-color:var(--purple); background:rgba(139,92,246,0.08); color:var(--purple);
}
.file-drop b{ color:var(--text-dim); }

.empty-state{ text-align:center; padding:56px 20px; color:var(--text-faint); }
.empty-state .big{ font-size:38px; margin-bottom:10px; }
.empty-state h3{ font-family:var(--disp); color:var(--text-dim); font-size:16px; margin-bottom:4px; }
.empty-state p{ font-size:13.5px; max-width:340px; margin:6px auto 0; }

.log{ margin-top:38px; }
.log-title{
  font-size:11px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--text-faint); font-weight:700; margin-bottom:12px; font-family:var(--disp);
}
.log-item{ display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px; }
.log-item:last-child{ border-bottom:none; }
.log-dot{ width:7px; height:7px; border-radius:50%; background:var(--green); margin-top:6px; flex-shrink:0; box-shadow:0 0 6px var(--green); }
.log-text{ color:var(--text-dim); }
.log-text b{ color:var(--text); font-weight:600; }
.log-time{ margin-left:auto; color:var(--text-faint); font-size:11.5px; font-family:var(--mono); white-space:nowrap; }

.hidden-input{ display:none; }

.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--bg-raised); border:1px solid var(--green-dim); color:var(--green);
  padding:11px 20px; border-radius:10px; font-size:13.5px; font-weight:600;
  opacity:0; pointer-events:none; transition:.25s; z-index:300;
  box-shadow:0 8px 30px rgba(0,0,0,0.4);
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- File table ---------- */
.file-table{
  border:1px solid var(--line); border-radius:12px; overflow:hidden;
  background:var(--bg-panel);
}
.file-row{
  display:grid;
  grid-template-columns:30px 1fr 92px 112px 84px 34px;
  align-items:center; gap:10px; padding:11px 16px;
  border-bottom:1px solid var(--line-soft); font-size:13.5px; transition:.12s;
}
.file-row:last-child{ border-bottom:none; }
.file-row:hover{ background:var(--bg-panel-hi); }
.file-row.head{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.07em;
  color:var(--text-faint); font-weight:700; background:var(--bg-raised);
}
.file-icon{ font-size:16px; }
.file-name{ font-family:var(--mono); color:var(--text); cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
.file-name:hover{ color:var(--cyan); }
.file-type-tag{ font-size:10px; font-weight:700; text-transform:uppercase; padding:3px 8px; border-radius:6px; letter-spacing:.03em; width:fit-content; }
.file-meta{ color:var(--text-faint); font-size:12px; font-family:var(--mono); }
.file-del{ color:var(--text-faint); background:none; border:none; cursor:pointer; font-size:15px; justify-self:end; padding:3px 7px; border-radius:6px; transition:.13s; }
.file-del:hover{ color:var(--red); background:rgba(251,113,133,0.1); }

/* ---------- New file type picker ---------- */
.type-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:18px; }
.type-card{
  border:1.5px solid var(--line); border-radius:11px; padding:16px 10px;
  text-align:center; cursor:pointer; transition:.15s; background:var(--bg-panel);
}
.type-card:hover{ border-color:var(--text-faint); transform:translateY(-1px); }
.type-card.sel{ border-color:var(--purple); background:rgba(139,92,246,0.1); box-shadow:0 0 0 3px rgba(139,92,246,0.12); }
.type-card .ic{ font-size:24px; margin-bottom:7px; }
.type-card .lbl{ font-size:12px; font-weight:600; color:var(--text-dim); }

/* ---------- Modals ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(5,6,14,0.75);
  display:none; align-items:center; justify-content:center; z-index:200;
  backdrop-filter:blur(4px); padding:20px;
}
.overlay.show{ display:flex; animation:fadeUp .18s ease; }
.modal{
  background:var(--bg-raised); border:1px solid var(--line); border-radius:16px;
  width:460px; max-width:92vw; padding:26px;
  box-shadow:0 24px 70px rgba(0,0,0,0.55);
  max-height:90vh; overflow-y:auto;
  animation:popIn .2s cubic-bezier(.2,.9,.3,1.2);
}
.modal h3{ font-size:17px; margin-bottom:5px; font-family:var(--disp); }
.modal p.sub{ font-size:12.5px; color:var(--text-faint); margin-bottom:18px; line-height:1.5; }
.field{ margin-bottom:15px; }
.field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:7px; font-weight:600; }
.field input, .field textarea, .field select{
  width:100%; background:var(--bg-panel); border:1.5px solid var(--line);
  color:var(--text); padding:10px 12px; border-radius:9px; font-size:13.5px;
  font-family:var(--sans); outline:none; transition:.13s;
}
.field textarea{ font-family:var(--mono); resize:vertical; min-height:120px; }
.field input:focus, .field textarea:focus, .field select:focus{ border-color:var(--purple); box-shadow:0 0 0 3px rgba(139,92,246,0.14); }
.swatches{ display:flex; gap:9px; margin-top:7px; }
.swatch{ width:24px; height:24px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:.13s; }
.swatch:hover{ transform:scale(1.12); }
.swatch.sel{ border-color:#fff; box-shadow:0 0 0 3px rgba(255,255,255,0.15); }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; flex-wrap:wrap; }

.editor-modal{ width:900px; max-width:96vw; }

/* ================= DOC EDITOR ================= */
.doc-toolbar{
  display:flex; gap:4px; padding:9px; border:1px solid var(--line);
  border-bottom:none; border-radius:10px 10px 0 0; background:var(--bg-panel); flex-wrap:wrap;
}
.doc-toolbar button{
  background:none; border:1px solid transparent; color:var(--text-dim);
  width:32px; height:32px; border-radius:7px; cursor:pointer; font-size:13px; font-weight:700;
}
.doc-toolbar button:hover{ background:var(--bg-panel-hi); border-color:var(--line); color:var(--text); }
.doc-toolbar .sep{ width:1px; background:var(--line); margin:5px 4px; }
.doc-canvas{
  border:1px solid var(--line); border-radius:0 0 10px 10px; background:#f7f5ff; color:#1a1a2e;
  min-height:480px; padding:48px 56px; font-family:Georgia, serif; font-size:15.5px;
  line-height:1.75; outline:none;
}
.doc-canvas:focus{ box-shadow: inset 0 0 0 2px var(--purple); }

/* ================= SLIDES EDITOR ================= */
.slides-wrap{ display:grid; grid-template-columns:170px 1fr; gap:18px; }
.slide-list{ display:flex; flex-direction:column; gap:9px; max-height:560px; overflow-y:auto; }
.slide-thumb{
  border:2px solid var(--line); border-radius:9px; background:linear-gradient(135deg, #161c35, #0e1226);
  aspect-ratio:16/9; padding:9px; cursor:pointer; position:relative; font-size:6px; overflow:hidden; color:var(--text-dim);
  transition:.13s;
}
.slide-thumb:hover{ border-color:var(--text-faint); }
.slide-thumb.active{ border-color:var(--purple); box-shadow:0 0 0 3px rgba(139,92,246,0.15); }
.slide-thumb .num{ position:absolute; bottom:4px; right:6px; font-size:9px; font-family:var(--mono); color:var(--text-faint); }
.add-slide-btn{
  border:1.5px dashed var(--line); border-radius:9px; aspect-ratio:16/9;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:var(--text-faint); font-size:22px; background:none; transition:.13s;
}
.add-slide-btn:hover{ border-color:var(--purple); color:var(--purple); }
.slide-stage{
  border:1px solid var(--line); border-radius:12px;
  background:linear-gradient(135deg, #181f3d, #0e1226);
  aspect-ratio:16/9; padding:44px; display:flex; flex-direction:column; justify-content:center; gap:16px;
}
.slide-stage [contenteditable]{ outline:none; }
.slide-stage .stitle{
  font-size:34px; font-weight:700; font-family:var(--disp); color:#fff;
  border-bottom:1.5px dashed transparent; background:linear-gradient(90deg, #fff, #cfd6ff); -webkit-background-clip:text; background-clip:text;
}
.slide-stage .stitle:focus{ border-color:var(--purple); -webkit-text-fill-color:#fff; }
.slide-stage .sbody{ font-size:17px; color:#c3cbf0; line-height:1.65; border-bottom:1.5px dashed transparent; }
.slide-stage .sbody:focus{ border-color:var(--purple); }
.slide-toolbar{ display:flex; gap:8px; margin-top:14px; }

/* ================= SHEETS EDITOR ================= */
.sheet-wrap{ overflow:auto; border:1px solid var(--line); border-radius:12px; max-height:600px; }
table.sheet{ border-collapse:collapse; font-family:var(--mono); font-size:12.5px; }
table.sheet th{
  background:var(--bg-panel); color:var(--text-faint); font-weight:600;
  padding:7px 4px; border:1px solid var(--line); position:sticky; top:0; z-index:2; min-width:92px; text-align:center;
}
table.sheet th.rownum{ position:sticky; left:0; z-index:3; min-width:34px; width:34px; }
table.sheet td.rownum{ background:var(--bg-panel); color:var(--text-faint); text-align:center; position:sticky; left:0; border:1px solid var(--line); }
table.sheet td{ border:1px solid var(--line-soft); padding:0; background:var(--bg-raised); }
table.sheet td input{ width:100%; height:100%; min-width:92px; background:none; border:none; outline:none; color:var(--text); font-family:var(--mono); font-size:12.5px; padding:6px 8px; }
table.sheet td input:focus{ background:rgba(139,92,246,0.12); box-shadow:inset 0 0 0 1.5px var(--purple); }
.sheet-toolbar{ display:flex; gap:8px; margin-bottom:14px; align-items:center; }

/* ================= CODE EDITOR ================= */
.code-area{
  width:100%; min-height:460px; background:#0a0d1c; color:#dbe1ff;
  border:1px solid var(--line); border-radius:12px; padding:16px;
  font-family:var(--mono); font-size:13px; line-height:1.65; resize:vertical;
  outline:none; tab-size:2;
}
.code-area:focus{ border-color:var(--purple); box-shadow:0 0 0 3px rgba(139,92,246,0.14); }
.preview-frame{ width:100%; height:460px; border:1px solid var(--line); border-radius:12px; background:#fff; }

/* ================= BLOCKS EDITOR ================= */
.block-chip{ padding:9px 11px; border-radius:9px; font-size:12.5px; font-weight:700; cursor:pointer; transition:.13s; color:#0b0e1a; }
.block-chip:hover{ transform:translateX(3px); filter:brightness(1.08); }
.block-row{ padding:9px 11px; border-radius:9px; font-size:12.5px; display:flex; align-items:center; gap:7px; flex-wrap:wrap; color:#0b0e1a; }
.block-row input{ border:none; border-radius:5px; padding:4px 7px; font-family:var(--mono); font-size:11.5px; background:rgba(255,255,255,0.55); }
.block-btn{ background:none; border:none; cursor:pointer; font-weight:800; color:#0b0e1a; opacity:.75; }
.block-btn:hover{ opacity:1; }

.section-card{ border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:22px; background:var(--bg-panel); }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" id="brandLogo"><div class="mark">G</div>Galaxy <span class="dim">business workspace</span></div>
  <div class="topbar-spacer"></div>
  <div class="search-box">
    <span>⌕</span>
    <input id="searchInput" placeholder="Search files across projects…">
  </div>
  <button class="btn" id="exportAllBtn">Export all</button>
  <button class="btn primary" id="newRepoTopBtn">+ New project</button>
  <div class="avatar-btn" id="avatarBtn" title="Account & settings">Y</div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<!-- New Repo Modal -->
<div class="overlay" id="repoModal">
  <div class="modal">
    <h3>Create a new project</h3>
    <p class="sub">A project holds all the files for one part of your business.</p>
    <div class="field">
      <label>Project name</label>
      <input id="repoNameInput" placeholder="e.g. Client Contracts">
    </div>
    <div class="field">
      <label>What's it for? (optional)</label>
      <input id="repoDescInput" placeholder="e.g. Signed agreements and proposals">

<script>
(function(){
  'use strict';

  /* ============================================================
     STORE — all data persistence (swap for real API calls later)
  ============================================================ */
  const STORE_KEY = 'galaxy_data_v1';
  const COLORS = ['#8b5cf6','#22d3ee','#fbbf24','#34d399','#fb7185','#f472b6'];
  const uid = () => Math.random().toString(36).slice(2,9);
  const now = () => Date.now();

  function seed(){
    const repo = {
      id: uid(), name:'Getting Started', desc:'A quick tour — feel free to delete this project.',
      color: COLORS[0], created: now(),
      files: [
        { id: uid(), name:'welcome.md', kind:'code', lang:'markdown',
          content:'# Welcome to Galaxy\n\nEach PROJECT (sidebar) is like a repo.\n\nAdd files with "+ New file" — pick Doc, Slides, Sheet, Code, or Block code.\n\nEverything here is stored in your browser via localStorage. Swap the STORE section of this file for real API calls when you wire up a backend.',
          size:0, added: now() }
      ],
      commits:[{id: uid(), text:'Initial commit', time: now()}]
    };
    return {
      activeUserId: 'u_default',
      users: [{ id:'u_default', name:'You', color: COLORS[1] }],
      repos: [repo],
      activeRepoId: repo.id,
      settings: { codeFontSize: 13 }
    };
  }

  let data;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    data = raw ? JSON.parse(raw) : seed();
  }catch(e){ data = seed(); }

  const Store = {
    save(){ localStorage.setItem(STORE_KEY, JSON.stringify(data)); },
    getData(){ return data; },
    listUsers(){ return data.users; },
    activeUser(){ return data.users.find(u=>u.id===data.activeUserId) || data.users[0]; },
    switchUser(id){ data.activeUserId = id; this.save(); },
    createUser(name){
      const u = { id: uid(), name, color: COLORS[Math.floor(Math.random()*COLORS.length)] };
      data.users.push(u); data.activeUserId = u.id; this.save(); return u;
    },
    renameActiveUser(name){ this.activeUser().name = name; this.save(); },
    listRepos(){ return data.repos; },
    activeRepo(){ return data.repos.find(r=>r.id===data.activeRepoId) || data.repos[0]; },
    setActiveRepo(id){ data.activeRepoId = id; this.save(); },
    createRepo(name, desc, color){
      const repo = { id: uid(), name, desc, color, created: now(), files: [], commits: [] };
      this.addCommit(repo, 'Created project');
      data.repos.unshift(repo); data.activeRepoId = repo.id; this.save();
      return repo;
    },
    deleteRepo(id){
      data.repos = data.repos.filter(r=>r.id!==id);
      if(data.activeRepoId === id) data.activeRepoId = data.repos.length ? data.repos[0].id : null;
      this.save();
    },
    updateRepoDesc(repo, desc){ repo.desc = desc; this.save(); },
    addCommit(repo, text){
      repo.commits.unshift({ id: uid(), text, time: now() });
      if(repo.commits.length > 60) repo.commits.pop();
    },
    addFile(repo, fileObj){
      const file = { id: uid(), added: now(), size:0, ...fileObj };
      file.size = new Blob([file.content || '']).size;
      repo.files.push(file);
      this.addCommit(repo, `Added ${file.name}`);
      this.save();
      return file;
    },
    updateFile(repo, fileId, newContent){
      const f = repo.files.find(x=>x.id===fileId);
      if(!f) return;
      f.content = newContent;
      f.size = new Blob([newContent]).size;
      this.save();
      return f;
    },
    deleteFile(repo, fileId){
      const f = repo.files.find(x=>x.id===fileId);
      if(!f) return;
      repo.files = repo.files.filter(x=>x.id!==fileId);
      this.addCommit(repo, `Deleted ${f.name}`);
      this.save();
    },
    findFile(repo, fileId){ return repo.files.find(x=>x.id===fileId); },
    getSettings(){ return data.settings; },
    updateSettings(patch){ Object.assign(data.settings, patch); this.save(); },
    exportAllJSON(){ return JSON.stringify(data, null, 2); }
  };

  /* ============================================================
     MODULE: DOC EDITOR
  ============================================================ */
  function newDocDefaultContent(){ return '<p>Start writing your document…</p>'; }
  function renderDocEditor(container, { content, onSave }){
    container.innerHTML = `
      <div class="doc-toolbar">
        <button data-cmd="bold" title="Bold"><b>B</b></button>
        <button data-cmd="italic" title="Italic"><i>I</i></button>
        <button data-cmd="underline" title="Underline"><u>U</u></button>
        <div class="sep"></div>
        <button data-cmd="formatBlock" data-val="H1">H1</button>
        <button data-cmd="formatBlock" data-val="H2">H2</button>
        <button data-cmd="formatBlock" data-val="P">¶</button>
        <div class="sep"></div>
        <button data-cmd="insertUnorderedList">•≡</button>
        <button data-cmd="insertOrderedList">1.≡</button>
        <div class="sep"></div>
        <button data-cmd="justifyLeft">⟸</button>
        <button data-cmd="justifyCenter">≡</button>
        <button data-cmd="justifyRight">⟹</button>
      </div>
      <div class="doc-canvas" contenteditable="true" spellcheck="true" id="docCanvas">${content}</div>
    `;
    const canvas = container.querySelector('#docCanvas');
    container.querySelectorAll('.doc-toolbar button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        canvas.focus();
        document.execCommand(btn.getAttribute('data-cmd'), false, btn.getAttribute('data-val') || null);
      });
    });
    canvas.addEventListener('input', ()=> onSave && onSave(canvas.innerHTML));
    return { getContent: ()=> canvas.innerHTML };
  }

  /* ============================================================
     MODULE: SLIDES EDITOR
  ============================================================ */
  function newSlidesDefaultContent(){
    return JSON.stringify([{ title:'Untitled presentation', body:'Click to edit this text' }]);
  }
  function renderSlidesEditor(container, { content, onSave }){
    let slides;
    try{ slides = JSON.parse(content); }catch(e){ slides = JSON.parse(newSlidesDefaultContent()); }
    let activeIdx = 0;
    function persist(){ onSave && onSave(JSON.stringify(slides)); }
    function esc(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    function draw(){
      container.innerHTML = `
        <div class="slides-wrap">
          <div class="slide-list" id="slideList"></div>
          <div>
            <div class="slide-stage" id="slideStage"></div>
            <div class="slide-toolbar">
              <button class="btn" id="dupSlideBtn">Duplicate slide</button>
              <button class="btn danger" id="delSlideBtn">Delete slide</button>
            </div>
          </div>
        </div>`;
      const list = container.querySelector('#slideList');
      slides.forEach((s, i)=>{
        const thumb = document.createElement('div');
        thumb.className = 'slide-thumb' + (i===activeIdx ? ' active' : '');
        thumb.innerHTML = `
          <div style="font-weight:800; font-size:9px; color:#fff; overflow:hidden; max-height:18px;">${esc(s.title)||'&nbsp;'}</div>
          <div style="margin-top:4px; color:#8b98a5; overflow:hidden; max-height:24px;">${esc(s.body)||''}</div>
          <div class="num">${i+1}</div>`;
        thumb.addEventListener('click', ()=>{ activeIdx = i; draw(); });
        list.appendChild(thumb);
      });
      const addBtn = document.createElement('button');
      addBtn.className = 'add-slide-btn'; addBtn.textContent = '+'; addBtn.title = 'Add slide';
      addBtn.addEventListener('click', ()=>{
        slides.push({ title:'New slide', body:'Click to edit this text' });
        activeIdx = slides.length - 1; persist(); draw();
      });
      list.appendChild(addBtn);

      const stage = container.querySelector('#slideStage');
      const s = slides[activeIdx];
      stage.innerHTML = `
        <div class="stitle" contenteditable="true" id="stageTitle">${esc(s.title)}</div>
        <div class="sbody" contenteditable="true" id="stageBody">${esc(s.body)}</div>`;
      stage.querySelector('#stageTitle').addEventListener('input', (e)=>{
        slides[activeIdx].title = e.target.textContent; persist();
        const t = list.children[activeIdx]; if(t) t.firstChild.textContent = e.target.textContent || '\u00A0';
      });
      stage.querySelector('#stageBody').addEventListener('input', (e)=>{
        slides[activeIdx].body = e.target.textContent; persist();
        const t = list.children[activeIdx]; if(t) t.children[1].textContent = e.target.textContent;
      });
      container.querySelector('#dupSlideBtn').addEventListener('click', ()=>{
        slides.splice(activeIdx+1, 0, { ...slides[activeIdx] }); activeIdx += 1; persist(); draw();
      });
      container.querySelector('#delSlideBtn').addEventListener('click', ()=>{
        if(slides.length <= 1) return;
        slides.splice(activeIdx, 1); activeIdx = Math.max(0, activeIdx - 1); persist(); draw();
      });
    }
    draw();
    return { getContent: ()=> JSON.stringify(slides) };
  }

  /* ============================================================
     MODULE: SHEETS EDITOR
  ============================================================ */
  const SHEET_ROWS = 14, SHEET_COLS = 8;
  function newSheetDefaultContent(){
    return JSON.stringify(Array.from({length:SHEET_ROWS}, ()=> Array(SHEET_COLS).fill('')));
  }
  function colLabel(i){ let s=''; i++; while(i>0){ const r=(i-1)%26; s=String.fromCharCode(65+r)+s; i=Math.floor((i-1)/26);} return s; }
  function parseRef(ref){
    const m = /^([A-Z]+)(\d+)$/.exec(ref.trim().toUpperCase());
    if(!m) return null;
    let col = 0; for(const ch of m[1]) col = col*26 + (ch.charCodeAt(0)-64); col -= 1;
    return { row: parseInt(m[2],10)-1, col };
  }
  function evalFormula(raw, grid){
    if(!raw.startsWith('=')) return raw;
    const expr = raw.slice(1).trim();
    const rangeFn = (name, fn) => {
      const re = new RegExp(name+'\\(([A-Z]+\\d+):([A-Z]+\\d+)\\)', 'i');
      const m = re.exec(expr); if(!m) return null;
      const a = parseRef(m[1]), b = parseRef(m[2]); if(!a||!b) return null;
      let vals = [];
      for(let r=Math.min(a.row,b.row); r<=Math.max(a.row,b.row); r++)
        for(let c=Math.min(a.col,b.col); c<=Math.max(a.col,b.col); c++){
          const v = parseFloat(grid[r] && grid[r][c]); if(!isNaN(v)) vals.push(v);
        }
      return fn(vals);
    };
    const sum = rangeFn('SUM', v=>v.reduce((a,b)=>a+b,0)); if(sum!==null) return String(sum);
    const avg = rangeFn('AVG', v=>v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):0); if(avg!==null) return String(avg);
    const max = rangeFn('MAX', v=>v.length?Math.max(...v):0); if(max!==null) return String(max);
    const min = rangeFn('MIN', v=>v.length?Math.min(...v):0); if(min!==null) return String(min);
    try{
      const sub = expr.replace(/[A-Z]+\d+/gi, ref=>{
        const p = parseRef(ref); if(!p) return '0';
        const v = parseFloat(grid[p.row] && grid[p.row][p.col]); return isNaN(v)?'0':v;
      });
      if(/^[\d+\-*/.()\s]+$/.test(sub)) return String(Function('"use strict";return ('+sub+')')());
    }catch(e){}
    return '#ERR';
  }
  function renderSheetEditor(container, { content, onSave }){
    let grid;
    try{ grid = JSON.parse(content); if(!Array.isArray(grid)||!Array.isArray(grid[0])) throw 0; }
    catch(e){ grid = JSON.parse(newSheetDefaultContent()); }
    function persist(){ onSave && onSave(JSON.stringify(grid)); }
    function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

    function draw(){
      const rows = grid.length, cols = grid[0].length;
      let html = `
        <div class="sheet-toolbar">
          <button class="btn" id="addRowBtn">+ Row</button>
          <button class="btn" id="addColBtn">+ Column</button>
          <span style="font-size:11.5px; color:var(--text-faint); font-family:var(--mono);">
            =SUM(A1:A5)  =AVG(...)  =MAX(...)  =MIN(...)  or  =A1+B2
          </span>
        </div>
        <div class="sheet-wrap"><table class="sheet"><thead><tr><th class="rownum"></th>`;
      for(let c=0;c<cols;c++) html += `<th>${colLabel(c)}</th>`;
      html += `</tr></thead><tbody>`;
      for(let r=0;r<rows;r++){
        html += `<tr><td class="rownum">${r+1}</td>`;
        for(let c=0;c<cols;c++) html += `<td><input data-r="${r}" data-c="${c}" value="${escAttr(grid[r][c]||'')}"></td>`;
        html += `</tr>`;
      }
      html += `</tbody></table></div>`;
      container.innerHTML = html;

      container.querySelectorAll('input[data-r]').forEach(inp=>{
        const r = +inp.dataset.r, c = +inp.dataset.c;
        inp.value = evalFormula(grid[r][c] || '', grid);
        inp.addEventListener('focus', ()=>{ inp.value = grid[r][c] || ''; });
        inp.addEventListener('blur', ()=>{
          grid[r][c] = inp.value; persist(); inp.value = evalFormula(inp.value, grid);
        });
        inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
      });
      container.querySelector('#addRowBtn').addEventListener('click', ()=>{ grid.push(Array(cols).fill('')); persist(); draw(); });
      container.querySelector('#addColBtn').addEventListener('click', ()=>{ grid.forEach(row=>row.push('')); persist(); draw(); });
    }
    draw();
    return { getContent: ()=> JSON.stringify(grid) };
  }

  /* ============================================================
     MODULE: CODE EDITOR
  ============================================================ */
  function newCodeDefaultContent(lang){
    const t = {
      html: '<!DOCTYPE html>\n<html>\n<head>\n  <title>My App</title>\n  <style>\n    body{ font-family: sans-serif; padding: 40px; }\n  </style>\n</head>\n<body>\n  <h1>Hello from Galaxy</h1>\n  <script>\n    console.log("running");\n  <\/script>\n</body>\n</html>',
      javascript: '// Your code here\nfunction greet(name){\n  return `Hello, ${name}!`;\n}\nconsole.log(greet("Galaxy"));',
      css: 'body {\n  font-family: sans-serif;\n}',
      markdown: '# New note\n\nWrite here…',
      python: '# Python code (preview not executable in-browser)\nprint("Hello from Galaxy")'
    };
    return t[lang] || '';
  }
  function renderCodeEditor(container, { content, lang, onSave }){
    const canPreview = lang === 'html';
    container.innerHTML = `
      <div class="toolbar">
        <span class="stat">Language: <b>${lang}</b></span>
        <div class="toolbar-spacer"></div>
        ${canPreview ? '<button class="btn primary" id="runBtn">▶ Run preview</button>' : ''}
      </div>
      <div style="display:grid; grid-template-columns:${canPreview ? '1fr 1fr' : '1fr'}; gap:16px;">
        <div><textarea id="codeArea" class="code-area" spellcheck="false">${content}</textarea></div>
        ${canPreview ? `<div>
          <div style="font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:700; margin-bottom:8px; font-family:var(--disp);">Live preview</div>
          <iframe id="previewFrame" class="preview-frame" sandbox="allow-scripts"></iframe>
        </div>` : ''}
      </div>`;
    const area = container.querySelector('#codeArea');
    area.addEventListener('input', ()=> onSave && onSave(area.value));
    area.addEventListener('keydown', e=>{
      if(e.key === 'Tab'){
        e.preventDefault();
        const start = area.selectionStart, end = area.selectionEnd;
        area.value = area.value.slice(0,start) + '  ' + area.value.slice(end);
        area.selectionStart = area.selectionEnd = start + 2;
        onSave && onSave(area.value);
      }
    });
    if(canPreview){
      const frame = container.querySelector('#previewFrame');
      const run = ()=>{ frame.srcdoc = area.value; };
      container.querySelector('#runBtn').addEventListener('click', run);
      run();
    }
    return { getContent: ()=> area.value };
  }

  /* ============================================================
     MODULE: BLOCK CODING
  ============================================================ */
  const PALETTE = [
    { type:'say',       label:'say [ ]',            color:'#22d3ee', fields:['text'] },
    { type:'log',       label:'console.log [ ]',    color:'#9aa3c7', fields:['text'] },
    { type:'setvar',    label:'set [var] to [ ]',    color:'#c792ea', fields:['name','value'] },
    { type:'changevar', label:'change [var] by [ ]', color:'#c792ea', fields:['name','value'] },
    { type:'if',        label:'if [ ] then',         color:'#fbbf24', fields:['cond'] },
    { type:'repeat',    label:'repeat [ ] times',    color:'#fb7185', fields:['count'] },
    { type:'wait',      label:'wait [ ] ms',         color:'#34d399', fields:['ms'] },
  ];
  function newBlocksDefaultContent(){
    return JSON.stringify([{ id:'b1', type:'setvar', name:'score', value:'0' },{ id:'b2', type:'say', text:'Game started!' }]);
  }
  function renderBlocksEditor(container, { content, onSave }){
    let blocks;
    try{ blocks = JSON.parse(content); }catch(e){ blocks = JSON.parse(newBlocksDefaultContent()); }
    function persist(){ onSave && onSave(JSON.stringify(blocks)); }
    function bid(){ return 'b' + Math.random().toString(36).slice(2,8); }

    function blockToJS(b){
      switch(b.type){
        case 'say': return `alert(${JSON.stringify(b.text||'')});`;
        case 'log': return `console.log(${JSON.stringify(b.text||'')});`;
        case 'setvar': return `vars[${JSON.stringify(b.name||'x')}] = (${JSON.stringify(b.value||'')});`;
        case 'changevar': return `vars[${JSON.stringify(b.name||'x')}] = (Number(vars[${JSON.stringify(b.name||'x')}])||0) + (${JSON.stringify(b.value||'0')});`;
        case 'if': return `if (${b.cond||'true'}) {`;
        case 'repeat': return `for(let i=0;i<${Number(b.count)||0};i++){`;
        case 'wait': return `await new Promise(r=>setTimeout(r, ${Number(b.ms)||0}));`;
        default: return '';
      }
    }
    function generateCode(){
      let lines = ['const vars = {};', '(async ()=>{'];
      blocks.forEach(b=>{ lines.push('  ' + blockToJS(b)); if(b.type==='if'||b.type==='repeat') lines.push('  }'); });
      lines.push('})();');
      return lines.join('\n');
    }
    function draw(){
      container.innerHTML = `
        <div style="display:grid; grid-template-columns:210px 1fr 1fr; gap:16px;">
          <div>
            <div style="font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:700; margin-bottom:9px; font-family:var(--disp);">Blocks</div>
            <div id="palette" style="display:flex; flex-direction:column; gap:7px;"></div>
          </div>
          <div>
            <div style="font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:700; margin-bottom:9px; font-family:var(--disp);">Script</div>
            <div id="stack" style="display:flex; flex-direction:column; gap:7px; min-height:400px; border:1.5px dashed var(--line); border-radius:12px; padding:12px;"></div>
          </div>
          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:9px;">
              <span style="font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:700; font-family:var(--disp);">Output</span>
              <button class="btn primary" id="runBlocksBtn">▶ Run</button>
            </div>
            <pre id="genCode" style="background:#0a0d1c; border:1px solid var(--line); border-radius:10px; padding:12px; font-family:var(--mono); font-size:11.5px; color:#8fd6a8; max-height:220px; overflow:auto; white-space:pre-wrap;"></pre>
            <div id="output" style="margin-top:12px; background:var(--bg-panel); border:1px solid var(--line); border-radius:10px; padding:12px; font-family:var(--mono); font-size:12px; color:var(--text-dim); min-height:120px; white-space:pre-wrap;">Output will appear here…</div>
          </div>
        </div>`;

      const palette = container.querySelector('#palette');
      PALETTE.forEach(p=>{
        const el = document.createElement('div');
        el.className = 'block-chip';
        el.textContent = p.label;
        el.style.background = p.color;
        el.addEventListener('click', ()=>{
          const nb = { id: bid(), type: p.type };
          p.fields.forEach(f=> nb[f] = (f==='value'||f==='count'||f==='ms') ? '0' : '');
          blocks.push(nb); persist(); draw();
        });
        palette.appendChild(el);
      });

      const stack = container.querySelector('#stack');
      if(blocks.length === 0){
        stack.innerHTML = `<div style="color:var(--text-faint); font-size:12.5px; text-align:center; padding:24px;">Click a block on the left to add it to your script.</div>`;
      }
      blocks.forEach((b, i)=>{
        const def = PALETTE.find(p=>p.type===b.type);
        const row = document.createElement('div');
        row.className = 'block-row';
        row.style.background = def.color;
        let inner = `<b style="font-weight:800;">${def.type}</b>`;
        def.fields.forEach(f=>{
          inner += ` <input data-field="${f}" value="${(b[f]||'').toString().replace(/"/g,'&quot;')}" style="width:${f==='cond'?120:74}px;">`;
        });
        inner += `<span style="margin-left:auto; display:flex; gap:5px;">
          <button class="block-btn" data-up="${i}" title="Move up">↑</button>
          <button class="block-btn" data-down="${i}" title="Move down">↓</button>
          <button class="block-btn" data-del="${i}" title="Delete">✕</button>
        </span>`;
        row.innerHTML = inner;
        stack.appendChild(row);
      });

      stack.querySelectorAll('input[data-field]').forEach(inp=>{
        inp.addEventListener('input', e=>{
          const row = e.target.closest('.block-row');
          const idx = Array.from(stack.children).indexOf(row);
          blocks[idx][e.target.dataset.field] = e.target.value;
          persist(); updateGenCode();
        });
      });
      stack.querySelectorAll('[data-del]').forEach(btn=> btn.addEventListener('click', ()=>{ blocks.splice(+btn.dataset.del,1); persist(); draw(); }));
      stack.querySelectorAll('[data-up]').forEach(btn=> btn.addEventListener('click', ()=>{
        const i = +btn.dataset.up; if(i>0){ [blocks[i-1],blocks[i]]=[blocks[i],blocks[i-1]]; persist(); draw(); }
      }));
      stack.querySelectorAll('[data-down]').forEach(btn=> btn.addEventListener('click', ()=>{
        const i = +btn.dataset.down; if(i<blocks.length-1){ [blocks[i+1],blocks[i]]=[blocks[i],blocks[i+1]]; persist(); draw(); }
      }));

      updateGenCode();
      container.querySelector('#runBlocksBtn').addEventListener('click', runBlocks);
    }
    function updateGenCode(){ const el = container.querySelector('#genCode'); if(el) el.textContent = generateCode(); }
    function runBlocks(){
      const out = container.querySelector('#output');
      const logs = [];
      const fakeConsole = { log: (...args)=> logs.push(args.join(' ')) };
      const fakeAlert = (msg) => logs.push('💬 ' + msg);
      try{
        const code = generateCode().replace(/console\.log/g, '__console.log').replace(/alert\(/g, '__alert(');
        const fn = new Function('__console', '__alert', code);
        fn(fakeConsole, fakeAlert);
        setTimeout(()=>{ out.textContent = logs.length ? logs.join('\n') : '(no output)'; }, 50);
      }catch(e){ out.textContent = 'Error: ' + e.message; }
    }
    draw();
    return { getContent: ()=> JSON.stringify(blocks) };
  }

  const FILE_TYPES = [
    { kind:'code',   lang:'html', ic:'💻', label:'HTML/Code' },
    { kind:'doc',    lang:null,   ic:'📝', label:'Document' },
    { kind:'slides', lang:null,   ic:'📊', label:'Slides' },
    { kind:'sheet',  lang:null,   ic:'📈', label:'Spreadsheet' },
    { kind:'blocks', lang:null,   ic:'🧩', label:'Block code' },

  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function fmtTime(ts){
    const diff = Date.now() - ts;
    if(diff < 60000) return 'just now';
    if(diff < 3600000) return Math.floor(diff/60000)+'m ago';
    if(diff < 86400000) return Math.floor(diff/3600000)+'h ago';
    return new Date(ts).toLocaleDateString(undefined,{month:'short', day:'numeric'});
  }
  function fmtSize(bytes){
    if(!bytes) return '—';
    if(bytes < 1024) return bytes+' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1)+' KB';
    return (bytes/1024/1024).toFixed(1)+' MB';
  }
  function fileIcon(f){
    if(f.kind === 'doc') return '📝';
    if(f.kind === 'slides') return '📊';
    if(f.kind === 'sheet') return '📈';
    if(f.kind === 'blocks') return '🧩';
    if(f.kind === 'binary'){
      const ext = f.name.split('.').pop().toLowerCase();
      const map = { pdf:'📕', png:'🖼️', jpg:'🖼️', jpeg:'🖼️', gif:'🖼️', svg:'🖼️', zip:'🗜️', doc:'📘', docx:'📘', xls:'📊', xlsx:'📊', ppt:'📙', pptx:'📙' };
      return map[ext] || '📄';
    }
    const langIcons = { html:'💻', css:'🎨', javascript:'💻', markdown:'📝', python:'🐍' };
    return langIcons[f.lang] || '📄';
  }
  function typeTagColor(f){
    if(f.kind==='doc') return { bg:'rgba(34,211,238,0.15)', fg:'#22d3ee' };
    if(f.kind==='slides') return { bg:'rgba(251,191,36,0.15)', fg:'#fbbf24' };
    if(f.kind==='sheet') return { bg:'rgba(52,211,153,0.15)', fg:'#34d399' };
    if(f.kind==='blocks') return { bg:'rgba(199,146,234,0.15)', fg:'#c792ea' };
    if(f.kind==='binary') return { bg:'rgba(154,163,199,0.15)', fg:'#9aa3c7' };
    return { bg:'rgba(251,113,133,0.15)', fg:'#fb7185' };
  }
  function toast(msg){

  function renderFileTable(repo){
    const wrap = document.getElementById('fileTableWrap');
    if(repo.files.length === 0){
      wrap.innerHTML = `<div class="empty-state"><div class="big">🗂️</div><p>No files yet. Create one or upload something to get started.</p></div>`;
      return;
    }
    let rows = `<div class="file-row head"><div></div><div>Name</div><div>Type</div><div>Added</div><div>Size</div><div></div></div>`;
    repo.files.slice().sort((a,b)=>b.added-a.added).forEach(f=>{
      const tag = typeTagColor(f);
      rows += `
        <div class="file-row" data-id="${f.id}">
          <div class="file-icon">${fileIcon(f)}</div>
          <div class="file-name" data-open="${f.id}">${escapeHtml(f.name)}</div>
          <div><span class="file-type-tag" style="background:${tag.bg}; color:${tag.fg};">${f.kind}</span></div>
          <div class="file-meta">${fmtTime(f.added)}</div>
          <div class="file-meta">${fmtSize(f.size)}</div>
          <button class="file-del" data-del="${f.id}" title="Delete file">✕</button>
        </div>`;
    });
    wrap.innerHTML = `<div class="file-table">${rows}</div>`;
    wrap.querySelectorAll('[data-open]').forEach(el=> el.addEventListener('click', ()=> openFileEditor(el.getAttribute('data-open'))));
    wrap.querySelectorAll('[data-del]').forEach(el=> el.addEventListener('click', e=>{ e.stopPropagation(); handleDeleteFile(el.getAttribute('data-del')); }));

      <div class="log-item"><div class="log-dot"></div><div class="log-text">${escapeHtml(c.text)}</div><div class="log-time">${fmtTime(c.time)}</div></div>`).join('');

  function handleDeleteRepo(id){

  function handleDeleteFile(fileId){
    const repo = Store.activeRepo();
    const f = Store.findFile(repo, fileId);

    Store.deleteFile(repo, fileId); renderAll(); toast('File deleted');

  function handleUploadedFiles(fileList){
    const repo = Store.activeRepo();
    if(!repo) return;
    Array.from(fileList).forEach(file=>{
      const reader = new FileReader();
      reader.onload = e=>{
        Store.addFile(repo, { name: file.name, kind:'binary', lang:null, content: e.target.result });
        renderAll(); toast('File added');
      };
      reader.readAsDataURL(file);
    });
  }

  function updateNewFileNamePlaceholder(){
    const map = { code:'index.html', doc:'business-plan', slides:'pitch-deck', sheet:'budget', blocks:'automation' };
    document.getElementById('newFileNameInput').placeholder = map[selectedNewFileType] || 'filename';

  function createNewFile(){
    let name = document.getElementById('newFileNameInput').value.trim();
    const repo = Store.activeRepo();
    if(!repo) return;
    let content, lang = selectedNewFileLang;
    switch(selectedNewFileType){
      case 'code':
        if(!name) name = 'untitled.html';
        lang = name.endsWith('.js') ? 'javascript' : name.endsWith('.css') ? 'css' : name.endsWith('.py') ? 'python' : name.endsWith('.md') ? 'markdown' : 'html';
        content = newCodeDefaultContent(lang); break;
      case 'doc':
        if(!name) name = 'untitled-doc'; if(!name.includes('.')) name += '.doc';
        content = newDocDefaultContent(); break;
      case 'slides':
        if(!name) name = 'untitled-slides'; if(!name.includes('.')) name += '.slides';
        content = newSlidesDefaultContent(); break;
      case 'sheet':
        if(!name) name = 'untitled-sheet'; if(!name.includes('.')) name += '.sheet';
        content = newSheetDefaultContent(); break;
      case 'blocks':
        if(!name) name = 'untitled-blocks'; if(!name.includes('.')) name += '.blocks';
        content = newBlocksDefaultContent(); break;
    }
    const file = Store.addFile(repo, { name, kind: selectedNewFileType, lang, content });
    closeNewFileModal(); renderAll(); toast('File created');
    openFileEditor(file.id);
  }

  function openFileEditor(fileId){
    const repo = Store.activeRepo();
    const f = Store.findFile(repo, fileId);
    if(!f) return;
    editingFileId = fileId;
    document.getElementById('viewFileName').textContent = f.name;
    document.getElementById('viewFileMeta').textContent = `${f.kind} · Added ${fmtTime(f.added)} · ${fmtSize(f.size)}`;
    const body = document.getElementById('editorBody');

    if(f.kind === 'binary'){
      body.innerHTML = `<div class="empty-state"><p>This file type can't be edited here. Download it to view it, or replace it by deleting and re-uploading.</p></div>`;
    } else if(f.kind === 'doc'){
      renderDocEditor(body, { content: f.content, onSave: autoSave });
    } else if(f.kind === 'slides'){
      renderSlidesEditor(body, { content: f.content, onSave: autoSave });
    } else if(f.kind === 'sheet'){
      renderSheetEditor(body, { content: f.content, onSave: autoSave });
    } else if(f.kind === 'blocks'){
      renderBlocksEditor(body, { content: f.content, onSave: autoSave });
    } else {
      renderCodeEditor(body, { content: f.content, lang: f.lang || 'html', onSave: autoSave });
    }
    document.getElementById('fileEditorModal').classList.add('show');
  }
  function autoSave(content){
    const repo = Store.activeRepo();
    if(!repo || !editingFileId) return;
    Store.updateFile(repo, editingFileId, content);
    renderSidebar();
  }
  function closeFileEditor(){
    document.getElementById('fileEditorModal').classList.remove('show');
    editingFileId = null; renderAll();
  }
  function downloadCurrentFile(){
    const repo = Store.activeRepo();
    const f = Store.findFile(repo, editingFileId);
    if(!f) return;
    let href, isDataUrl = (f.content||'').startsWith('data:');
    if(isDataUrl){ href = f.content; }
    else { const blob = new Blob([f.content], {type:'text/plain'}); href = URL.createObjectURL(blob); }
    const a = document.createElement('a'); a.href = href; a.download = f.name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    if(!isDataUrl) URL.revokeObjectURL(href);
  }

  function openDeployModal(repo){
    const modal = document.getElementById('deployModal');
    const slug = repo.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'project';
    document.getElementById('deployUrl').textContent = `${slug}.galaxy.app`;
    document.getElementById('deployBody').innerHTML = `<p class="sub">This is a local preview only — Galaxy doesn't host live sites. To actually publish this project, download it below and push it to your own host (Netlify, Render, GitHub Pages, etc).</p>`;
    modal.classList.add('show');
    document.getElementById('deployDownloadBtn').onclick = ()=>{
      const htmlFile = repo.files.find(f => f.kind==='code' && f.lang==='html');
      if(htmlFile){
        const blob = new Blob([htmlFile.content], {type:'text/html'});
        const href = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = href; a.download = htmlFile.name;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(href); toast('Downloaded — push this to your host');
      } else { toast('Add an HTML file to this project first'); }
    };
    document.getElementById('deployPreviewBtn').onclick = ()=>{
      const htmlFile = repo.files.find(f => f.kind==='code' && f.lang==='html');
      if(!htmlFile){ toast('Add an HTML file to this project first'); return; }
      const win = window.open('', '_blank');
      win.document.write(htmlFile.content); win.document.close();
    };
  }
  function closeDeployModal(){ document.getElementById('deployModal').classList.remove('show'); }

  function doExportAll(){
    const blob = new Blob([Store.exportAllJSON()], {type:'application/json'});
    const href = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = href; a.download = 'galaxy-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(href); toast('Backup downloaded');
  }

  function handleSearch(q){
    q = q.trim().toLowerCase();
    if(!q){ renderAll(); return; }
    const main = document.getElementById('main');
    let results = [];
    Store.listRepos().forEach(repo=> repo.files.forEach(f=>{ if(f.name.toLowerCase().includes(q)) results.push({repo, f}); }));
    main.innerHTML = `
      <div class="repo-title" style="margin-bottom:18px;">Search results <span class="badge">${results.length}</span></div>
      <div class="file-table">
        ${results.length ? results.map(r => `
          <div class="file-row" data-repo="${r.repo.id}" data-file="${r.f.id}" style="cursor:pointer; grid-template-columns:30px 1fr 92px 112px;">
            <div class="file-icon">${fileIcon(r.f)}</div>
            <div class="file-name">${escapeHtml(r.f.name)} <span style="color:var(--text-faint);font-size:11.5px;">— ${escapeHtml(r.repo.name)}</span></div>
            <div class="file-meta">${fmtTime(r.f.added)}</div>
            <div class="file-meta">${fmtSize(r.f.size)}</div>
          </div>`).join('') : `<div class="empty-state"><p>No files match "${escapeHtml(q)}"</p></div>`}
      </div>`;
    main.querySelectorAll('.file-row[data-file]').forEach(row=>{
      row.addEventListener('click', ()=>{
        Store.setActiveRepo(row.getAttribute('data-repo'));
        view = 'repo'; renderSidebar(); renderRepoView();
        openFileEditor(row.getAttribute('data-file'));
      });
    });
  }

  function init(){
    document.getElementById('brandLogo').addEventListener('click', ()=>{ view='repo'; renderAll(); });
    document.getElementById('exportAllBtn').addEventListener('click', doExportAll);
    document.getElementById('newRepoTopBtn').addEventListener('click', openRepoModal);
    document.getElementById('avatarBtn').addEventListener('click', ()=>{ view='settings'; renderAll(); });

    document.getElementById('repoCancelBtn').addEventListener('click', closeRepoModal);
    document.getElementById('repoCreateBtn').addEventListener('click', ()=>{
      const name = document.getElementById('repoNameInput').value.trim();
      if(!name){ toast('Give your project a name'); return; }
      const desc = document.getElementById('repoDescInput').value.trim();
      Store.createRepo(name, desc, selectedRepoColor);
      closeRepoModal(); view = 'repo'; renderAll(); toast('Project created');
    });

    document.getElementById('newFileCancelBtn').addEventListener('click', closeNewFileModal);
    document.getElementById('newFileCreateBtn').addEventListener('click', createNewFile);

    document.getElementById('viewCloseBtn').addEventListener('click', closeFileEditor);
    document.getElementById('viewDownloadBtn').addEventListener('click', downloadCurrentFile);

    document.getElementById('deployCloseBtn').addEventListener('click', closeDeployModal);

    document.getElementById('uploadInput').addEventListener('change', e=>{ handleUploadedFiles(e.target.files); e.target.value = ''; });
    document.getElementById('searchInput').addEventListener('input', e=> handleSearch(e.target.value));

    ['repoModal','newFileModal','fileEditorModal','deployModal'].forEach(id=>{
      const ov = document.getElementById(id);
      ov.addEventListener('click', e=>{ if(e.target === ov){ ov.classList.remove('show'); if(id==='fileEditorModal') renderAll(); } });
    });

    renderAll();
  }

  init();
})();
</script>
</body>
</html>
